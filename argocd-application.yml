# Argo CD가 GitHub Manifest 저장소의 Monolith 경로를 EKS에 동기화합니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-monolith
  namespace: argocd
  # Application을 삭제할 때 배포된 리소스(Ingress, PVC 등)도 함께 삭제합니다.
  # 없으면 Application만 지워지고 리소스(EBS 볼륨 포함)가 클러스터에 남습니다.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SJH910/my-k8s-manifests.git
    targetRevision: main
    path: monolith
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Ingress-NGINX admission webhook 준비 전 실패 등 일시 오류 시 재시도합니다.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
