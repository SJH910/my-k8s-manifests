---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-initdb-config
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS fcgidb;
    USE fcgidb;
    CREATE TABLE users (
      id INT AUTO_INCREMENT PRIMARY KEY,
      username VARCHAR(64) NOT NULL UNIQUE,
      password VARCHAR(128) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # EKS에 기본으로 제공되는 AWS EBS gp2 StorageClass를 사용합니다.
  storageClassName: gp2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  selector:
    matchLabels: { app: mariadb }
  template:
    metadata:
      labels: { app: mariadb }
    spec:
      containers:
      - name: mariadb
        image: mariadb:11
        env:
        - name: MARIADB_ROOT_PASSWORD
          value: rootpass
        - name: MARIADB_DATABASE
          value: fcgidb
        - name: MARIADB_USER
          value: fcgiuser
        - name: MARIADB_PASSWORD
          value: fcgipass
        ports:
        - containerPort: 3306
        volumeMounts:
        - mountPath: /var/lib/mysql
          subPath: "mysql"
          name: mariadb-data
        - mountPath: /docker-entrypoint-initdb.d
          name: pvc-nfs-dynamic-3tier-mariadb
      volumes:
      - name: mariadb-data
        persistentVolumeClaim:
          claimName: mariadb-pvc
      - name: pvc-nfs-dynamic-3tier-mariadb
        configMap:
          name: mariadb-initdb-config
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector: { app: mariadb }
  ports:
  - port: 3306
    targetPort: 3306
