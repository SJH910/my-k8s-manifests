---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcgi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastcgi-backend
  template:
    metadata:
      labels:
        app: fastcgi-backend
    spec:
      containers:
      - name: backend
        image: 637423638906.dkr.ecr.ap-northeast-2.amazonaws.com/fastapi-backend:7720d056912d36e09322d1a7b1732778cbaf5a99
        env:
        - name: DB_HOST
          value: mariadb
        - name: DB_USER
          value: fcgiuser
        - name: DB_PASSWORD
          value: fcgipass
        - name: DB_NAME
          value: fcgidb
        ports:
        # Dockerfile의 uvicorn이 8000 포트에서 실행됩니다.
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fastcgi-backend
spec:
  selector:
    app: fastcgi-backend
  ports:
  - port: 8000
    targetPort: 8000
