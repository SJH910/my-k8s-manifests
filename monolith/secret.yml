# 로컬 Kubernetes 실습용 DB 인증정보
#
# 주의: stringData 값은 평문이므로 운영 환경이나 공개 Git 저장소에
# 그대로 저장하지 말고 AWS Secrets Manager 등을 사용해야 합니다.
apiVersion: v1
kind: Secret
metadata:
  # backend 서비스와 MariaDB Deployment에서 참조하는 Secret 이름
  name: mariadb-secret
type: Opaque
stringData:
  # MariaDB 컨테이너의 root 계정 비밀번호
  MARIADB_ROOT_PASSWORD: rootpass
  # 사용자 인증 DB 접속 계정
  FCGI_USER: fcgiuser
  FCGI_PASSWORD: fcgipass
  # 게시판 DB 접속 계정
  BOARD_USER: boarduser
  BOARD_PASSWORD: boardpass
