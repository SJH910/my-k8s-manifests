---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastcgi-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: fastcgi-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            # Monolith에서는 별도의 frontend Service를 사용하지 않습니다.
            name: fastcgi-backend
            port:
              number: 8000
